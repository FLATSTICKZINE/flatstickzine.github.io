<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLAT STICK</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap');

:root {
  --black: #0a0a0a;
  --white: #ffffff;
  --grey: #999;
  --mid: #444;
  --border: 2px solid var(--black);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--white);
  color: var(--black);
  font-family: 'Courier Prime', monospace;
  overflow-x: hidden;
  cursor: crosshair;
}

/* ── TICKER ── */
.ticker {
  background: var(--black);
  color: var(--white);
  font-size: 10px;
  letter-spacing: 4px;
  padding: 7px 0;
  overflow: hidden;
  white-space: nowrap;
  text-transform: uppercase;
}
.ticker-inner {
  display: inline-block;
  animation: ticker 22s linear infinite;
}
@keyframes ticker {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* ── HEADER ── */
.site-header {
  border-bottom: 3px solid var(--black);
  padding: 20px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.site-title {
  font-size: clamp(28px, 5vw, 52px);
  font-weight: 700;
  letter-spacing: -0.02em;
  text-decoration: none;
  color: var(--black);
}

.back-link {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--black);
  border-bottom: 1px solid var(--black);
  padding-bottom: 2px;
}

.back-link:hover { opacity: 0.5; }

/* ── ISSUE HERO ── */
.issue-hero {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-bottom: 3px solid var(--black);
  min-height: 60vh;
}

.issue-hero-cover {
  border-right: 3px solid var(--black);
  overflow: hidden;
}

.issue-hero-cover img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
  filter: grayscale(100%);
}

.issue-hero-info {
  padding: 50px 50px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
}

.issue-number {
  font-size: 120px;
  font-weight: 700;
  line-height: 1;
  letter-spacing: -6px;
  color: var(--black);
  opacity: 0.08;
  margin-bottom: -20px;
}

.issue-title-block {
  flex: 1;
  display: flex;
  flex-direction: column;
  justify-content: center;
}

.issue-label {
  font-size: 9px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--grey);
  margin-bottom: 10px;
}

.issue-title {
  font-size: clamp(28px, 4vw, 48px);
  font-weight: 700;
  letter-spacing: -0.02em;
  line-height: 1.1;
  margin-bottom: 16px;
}

.issue-meta {
  font-size: 11px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--mid);
  line-height: 2;
  margin-bottom: 32px;
  border-left: 2px solid var(--black);
  padding-left: 14px;
}

.issue-about {
  font-size: 14px;
  line-height: 1.9;
  color: var(--mid);
  margin-bottom: 40px;
  max-width: 420px;
}

/* Buy buttons */
.buy-block {
  border-top: 2px solid var(--black);
  padding-top: 24px;
}

.buy-label {
  font-size: 9px;
  letter-spacing: 4px;
  text-transform: uppercase;
  color: var(--grey);
  margin-bottom: 14px;
}

.btn {
  display: inline-block;
  padding: 12px 24px;
  font-family: 'Courier Prime', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  text-decoration: none;
  border: var(--border);
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
  background: var(--white);
  color: var(--black);
  margin-right: 10px;
  margin-bottom: 10px;
}

.btn:hover { background: var(--black); color: var(--white); }
.btn-primary { background: var(--black); color: var(--white); }
.btn-primary:hover { opacity: 0.8; }
.btn-ghost { opacity: 0.4; cursor: default; }
.btn-ghost:hover { background: var(--white); color: var(--black); }

.sticker-note {
  font-size: 10px;
  letter-spacing: 2px;
  text-transform: uppercase;
  color: var(--grey);
  margin-top: 10px;
}

/* ── CAROUSEL ── */
.carousel-section {
  border-bottom: 3px solid var(--black);
}

.carousel-header {
  border-bottom: 2px solid var(--black);
  padding: 14px 40px;
  display: flex;
  align-items: center;
  justify-content: space-between;
}

.section-title {
  font-size: 11px;
  letter-spacing: 5px;
  text-transform: uppercase;
  font-weight: 700;
}

.carousel-nav {
  display: flex;
  gap: 8px;
}

.carousel-btn {
  width: 36px;
  height: 36px;
  border: var(--border);
  background: var(--white);
  cursor: pointer;
  font-size: 16px;
  display: flex;
  align-items: center;
  justify-content: center;
  transition: background 0.12s, color 0.12s;
  font-family: monospace;
}

.carousel-btn:hover { background: var(--black); color: var(--white); }

.carousel-track-wrap {
  overflow: hidden;
  position: relative;
}

.carousel-track {
  display: flex;
  transition: transform 0.4s ease;
}

.carousel-slide {
  min-width: 100%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #f0ede8;
  padding: 40px;
  min-height: 70vh;
}

.carousel-slide img {
  max-width: 100%;
  max-height: 75vh;
  object-fit: contain;
  display: block;
  box-shadow: 0 8px 40px rgba(0,0,0,0.15);
}

.carousel-counter {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--grey);
  padding: 12px 40px;
  border-top: 1px solid var(--black);
  text-align: center;
}

/* ── PREV/NEXT ISSUES ── */
.issue-nav {
  display: grid;
  grid-template-columns: 1fr 1fr;
  border-bottom: 3px solid var(--black);
}

.issue-nav-item {
  padding: 28px 40px;
  text-decoration: none;
  color: var(--black);
  border-right: 2px solid var(--black);
  transition: background 0.12s;
  display: flex;
  flex-direction: column;
  gap: 6px;
}

.issue-nav-item:last-child { border-right: none; }
.issue-nav-item:hover { background: var(--black); color: var(--white); }

.issue-nav-dir {
  font-size: 9px;
  letter-spacing: 4px;
  text-transform: uppercase;
  opacity: 0.5;
}

.issue-nav-title {
  font-size: 14px;
  font-weight: 700;
  letter-spacing: 2px;
}

.issue-nav-item.next { text-align: right; }

/* ── FOOTER ── */
footer {
  background: var(--black);
  color: var(--white);
  padding: 28px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
}

/* ── MOBILE ── */
@media (max-width: 680px) {
  .site-header { padding: 16px 20px; }
  .issue-hero { grid-template-columns: 1fr; }
  .issue-hero-cover { border-right: none; border-bottom: 3px solid var(--black); min-height: 60vw; }
  .issue-hero-info { padding: 32px 20px; }
  .issue-number { font-size: 72px; }
  .carousel-slide { padding: 20px; min-height: 50vw; }
  .issue-nav { grid-template-columns: 1fr; }
  .issue-nav-item { border-right: none; border-bottom: 2px solid var(--black); }
  .issue-nav-item.next { text-align: left; }
  footer { flex-direction: column; gap: 10px; text-align: center; padding: 20px; }
  .carousel-header, .carousel-counter { padding-left: 20px; padding-right: 20px; }
}
/* ── ORDER MODAL ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }

.modal {
  background: #fff;
  max-width: 560px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  border: 3px solid #0a0a0a;
}

.modal-header {
  background: #0a0a0a;
  color: #fff;
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-header h2 {
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  font-weight: 700;
}

.modal-close {
  background: none;
  border: none;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  opacity: 0.7;
  font-family: monospace;
}
.modal-close:hover { opacity: 1; }

.modal-body { padding: 24px; }

.pricing-guide {
  background: #f5f2ee;
  border: 1px solid #ddd;
  padding: 16px;
  margin-bottom: 24px;
  font-size: 11px;
  letter-spacing: 1px;
  line-height: 2;
}

.pricing-guide strong {
  display: block;
  font-size: 9px;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 8px;
  color: #999;
}

.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 6px;
  color: #444;
}

.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid #0a0a0a;
  font-family: 'Courier Prime', monospace;
  font-size: 13px;
  background: #fff;
  outline: none;
}

.form-group textarea { height: 80px; resize: vertical; }

.issues-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 6px;
}

.issue-check {
  border: 2px solid #ddd;
  padding: 10px 12px;
  cursor: pointer;
  transition: border-color 0.12s, background 0.12s;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  letter-spacing: 1px;
  user-select: none;
}

.issue-check input[type="checkbox"] { 
  width: 16px; 
  height: 16px;
  min-width: 16px;
  margin: 0; 
  cursor: pointer;
  accent-color: #0a0a0a;
}
.issue-check:has(input:checked) { border-color: #0a0a0a; background: #f5f2ee; }

.modal-footer {
  padding: 16px 24px;
  border-top: 2px solid #0a0a0a;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.order-total {
  font-size: 13px;
  letter-spacing: 2px;
}

.order-total strong { font-size: 22px; font-weight: 700; }
.order-saving { font-size: 10px; color: #999; letter-spacing: 1px; }

.btn-order {
  padding: 14px 28px;
  background: #0a0a0a;
  color: #fff;
  font-family: 'Courier Prime', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  border: none;
  cursor: pointer;
  transition: opacity 0.12s;
}
.btn-order:hover { opacity: 0.8; }

/* Issue card order button */
</style>
</head>

<script>
// ─────────────────────────────────────────────
// ISSUE DATA — keep in sync with index.html
// ─────────────────────────────────────────────
const issues = [
  {
    label: "02",
    title: "Stuck in Broken Hill",
    titleImg: "Stuck.png",
    date: "March 2026",
    location: "Broken Hill, NSW",
    cover: "issue2.webp",
    pages: ["issue2.webp", "issue2contents.webp", "issue2mid.webp"],
    about: "Shot on 35mm somewhere near Broken Hill. Developed in the van, printed at the library. Limited to 50 copies.",
    pdf_price: 3,
    print_price: 10,
    available: true,
    pdf_url: "https://www.paypal.com/ncp/payment/YS5BMKLK25SMG",
    print_url: "https://www.paypal.com/ncp/payment/TF2WBPUNLG8X2",
    edition: 50,
  },
  {
    label: "03",
    title: "???",
    date: "Coming Soon",
    location: "Somewhere out west",
    cover: "issue3.webp",
    pdf_price: 3,
    print_price: 10,
    available: false,
    pdf_url: "",
    print_url: "",
    edition: 50,
  },
  {
    label: "01",
    title: "Leaving Victoria",
    titleImg: "leavingvic.png",
    date: "February 2026",
    location: "Melbourne → Broken Hill",
    cover: "issue1.webp",
    pages: ["issue1.webp", "issue1contents.webp", "issue1mid.webp"],
    about: "The first issue. Left Melbourne as the oil crisis started, drove north. Shot on 35mm, developed in the van.",
    pdf_price: 3,
    print_price: 10,
    available: true,
    pdf_url: "https://www.paypal.com/ncp/payment/YS5BMKLK25SMG",
    print_url: "https://www.paypal.com/ncp/payment/TF2WBPUNLG8X2",
    edition: 50,
  },
];

// Get issue from URL param e.g. issue.html?i=01
const params = new URLSearchParams(window.location.search);
const issueLabel = params.get('i') || issues[0].label;
const issueIndex = issues.findIndex(i => i.label === issueLabel);
const issue = issues[issueIndex] || issues[0];

// Set page title
document.title = `FLAT STICK — Issue ${issue.label}`;

// Random matching reel frame for title
const frameCount = 6;
const frame = Math.floor(Math.random() * frameCount) + 1;
document.getElementById('title-flat').src = `flat${frame}.png`;
document.getElementById('title-stick').src = `stick${frame}.png`;

// ── Build hero ──
const hero = document.getElementById('issue-hero');
const pdfBtn = (issue.available && issue.pdf_url)
  ? `<a href="${issue.pdf_url}" class="btn btn-primary" target="_blank">Buy PDF — $${issue.pdf_price}</a>`
  : `<span class="btn btn-ghost">PDF — Coming Soon</span>`;
const printBtn = issue.available
  ? `<button class="btn" onclick="openOrder('${issue.label}')" style="cursor:pointer;">Order Print — $${issue.print_price}</button>`
  : `<span class="btn btn-ghost">Print — Coming Soon</span>`;

hero.innerHTML = `
  <div class="issue-hero-cover">
    <img src="${issue.cover}" alt="Flat Stick Issue ${issue.label}">
  </div>
  <div class="issue-hero-info">
    <div class="issue-title-block">
      <div class="issue-label">Issue ${issue.label}</div>
      <h1 class="issue-title">${issue.title}</h1>
    </div>
    <div class="buy-block">
      <div class="buy-label">Get a copy</div>
      ${pdfBtn}${printBtn}
      
      
    </div>
  </div>
`;

// ── Build carousel ──
const track = document.getElementById('carousel-track');
const counter = document.getElementById('carousel-counter');
let current = 0;

issue.pages.forEach((src, i) => {
  if (i === 0) return; // skip cover - already shown above
  const slide = document.createElement('div');
  slide.className = 'carousel-slide';
  slide.innerHTML = `<img src="${src}" alt="Issue ${issue.label} page ${i+1}" style="filter:grayscale(100%);">`;
  track.appendChild(slide);
});

function goTo(idx) {
  current = Math.max(0, Math.min(idx, issue.pages.length - 1));
  track.style.transform = `translateX(-${current * 100}%)`;
  counter.textContent = `${current + 1} / ${issue.pages.length}`;
}

document.getElementById('prev-slide').addEventListener('click', () => goTo(current - 1));
document.getElementById('next-slide').addEventListener('click', () => goTo(current + 1));

// Swipe support
let touchStartX = 0;
track.addEventListener('touchstart', e => { touchStartX = e.touches[0].clientX; });
track.addEventListener('touchend', e => {
  const diff = touchStartX - e.changedTouches[0].clientX;

// ── ORDER MODAL JS ──
const BUNDLE_PRICES = { 1: 10, 2: 17, 3: 24, 4: 30 };
const FORMSPREE_URL = "https://formspree.io/f/xzdjjwzy";

function calcTotal(printCount) {
  return BUNDLE_PRICES[Math.min(printCount, 4)] || (printCount * 10);
}

function openOrder(preselect) {
  const overlay = document.getElementById('order-overlay');
  overlay.classList.add('open');
  if (preselect) {
    const cb = document.querySelector(`input[name="issues"][value="${preselect}"]`);
    if (cb) cb.checked = true;
  }
  updateOrderTotal();
}

function closeOrder() {
  document.getElementById('order-overlay').classList.remove('open');
}

function updateOrderTotal() {
  const checked = document.querySelectorAll('input[name="issues"]:checked');
  const count = checked.length;
  const total = calcTotal(count);
  const saving = (count * 10) - total;
  document.getElementById('order-total-val').textContent = count > 0 ? `$${total}` : '$0';
  document.getElementById('order-saving').textContent = saving > 0 ? `saving $${saving} on postage` : '';
}



document.addEventListener('DOMContentLoaded', () => {
  // Populate modal issue checkboxes
  const modalIssues = document.getElementById('modal-issues');
  if (modalIssues) {
    issues.filter(i => i.available).forEach(iss => {
      const label = document.createElement('label');
      label.className = 'issue-check';
      label.innerHTML = `<input type="checkbox" name="issues" value="${iss.label}"> Issue ${iss.label} — ${iss.title}`;
      modalIssues.appendChild(label);
      label.querySelector('input').addEventListener('change', updateOrderTotal);
    });
  }

  // Close on overlay click
  document.getElementById('order-overlay').addEventListener('click', e => {
    if (e.target === document.getElementById('order-overlay')) closeOrder();
  });




  // Form submit
  document.getElementById('order-form').addEventListener('submit', async e => {
    e.preventDefault();
    const form = e.target;
    const name     = form.querySelector('[name="name"]').value.trim();
    const street   = form.querySelector('[name="street"]').value.trim();
    const suburb   = form.querySelector('[name="suburb"]').value.trim();
    const state    = form.querySelector('[name="state"]').value;
    const postcode = form.querySelector('[name="postcode"]').value.trim();
    const checked  = [...form.querySelectorAll('input[name="issues"]:checked')];

    if (!name || !street || !suburb || !state || !postcode) { alert('Please fill in all address fields.'); return; }
    if (checked.length === 0) { alert('Please select at least one issue.'); return; }

    const address = `${street}, ${suburb} ${state} ${postcode}`;
    const issueList = checked.map(c => `Issue ${c.value}`).join(', ');
    const total = calcTotal(checked.length);
    const saving = (checked.length * 10) - total;

    const btn = form.querySelector('.btn-order');
    btn.textContent = 'Sending...';
    btn.disabled = true;

    try {
      await fetch(FORMSPREE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ name, address, issues: issueList, total: `$${total}`, saving: saving > 0 ? `$${saving}` : 'none' })
      });
    } catch(err) { console.log('Formspree error', err); }

    // Redirect to PayPal
    closeOrder();
    window.location.href = `https://paypal.me/flatstickzine/${total}AUD`;
  });
});

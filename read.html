<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLAT STICK — Read Online</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a1a1a;
  color: #fff;
  font-family: 'Courier Prime', monospace;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  background: #0a0a0a;
  border-bottom: 2px solid #333;
  padding: 12px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.topbar-title { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; }
.topbar-issue { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #999; }
.topbar-back  { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #999; text-decoration: none; }
.topbar-back:hover { color: #fff; }

.viewer {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow: hidden;
}

#book { box-shadow: 0 20px 80px rgba(0,0,0,0.8); }
#book .page { background: #f8f5f0; overflow: hidden; }
#book .page img { width: 100%; height: 100%; object-fit: cover; display: block; }
#book .page.blank { background: transparent !important; box-shadow: none !important; border: none !important; }
#book .page.spread-page { overflow: visible; }
#book .page.spread-page img { width: 200%; height: 100%; object-fit: cover; position: absolute; top: 0; left: 0; }

.controls {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 16px;
  flex-shrink: 0;
}
.ctrl-btn {
  width: 44px; height: 44px;
  border: 1px solid #444; background: #222; color: #fff;
  cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.12s;
  user-select: none;
}
.ctrl-btn:hover:not([disabled]) { background: #444; }
.ctrl-btn[disabled] { opacity: 0.25; cursor: default; }

.page-counter { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #999; min-width: 80px; text-align: center; }
.progress-wrap { width: 100%; max-width: 900px; margin-top: 10px; height: 2px; background: #333; }
.progress-bar  { height: 100%; background: #666; transition: width 0.3s ease; }
.hint { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: #444; margin-top: 8px; }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">Flat Stick</span>
  <span class="topbar-issue" id="topbar-issue">Issue —</span>
  <a href="index.html" class="topbar-back">&#8592; Back</a>
</div>

<div class="viewer">
  <div id="book"></div>
  <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
  <div class="controls">
    <button class="ctrl-btn" id="btn-prev">&#8592;</button>
    <span class="page-counter" id="page-counter">— / —</span>
    <button class="ctrl-btn" id="btn-next">&#8594;</button>
  </div>
  <div class="hint">Click page edges or use arrow keys to turn</div>
</div>

<script>
const issues = {
  "01": {
    label: "01", title: "Leaving Victoria",
    folder: "issue1", totalPages: 16,
    spreads: [8], skipPages: [9], singlePages: [1, 16],
  },
  "02": {
    label: "02", title: "Stuck in Broken Hill",
    folder: "issue2", totalPages: 20,
    spreads: [10], skipPages: [11], singlePages: [1, 20],
  },
};

const params = new URLSearchParams(window.location.search);
const issueKey = params.get('i') || '01';
const issue = issues[issueKey] || issues['01'];

document.getElementById('topbar-issue').textContent = `Issue ${issue.label} — ${issue.title}`;
document.title = `FLAT STICK — Issue ${issue.label}`;

const pages = Array.from({length: issue.totalPages}, (_, i) => ({
  num: i + 1,
  src: `${issue.folder}/${i + 1}.webp`,
  isSpread: issue.spreads.includes(i + 1),
  skip: issue.skipPages.includes(i + 1),
})).filter(p => !p.skip);

// Fit to viewport
const pageH = Math.min(window.innerHeight - 160, 680);
const pageW = Math.round(pageH / 1.414);
const bookW = pageW * 2;
const bookH = pageH;

const book = document.getElementById('book');
book.style.width = bookW + 'px';
book.style.height = bookH + 'px';

// Build pages for Turn.js
// For spread: use Turn.js 'pages' option to make it span 2 columns
// We track which Turn.js index each page gets so we can call turn('pages') after init
const spreadTurnPages = [];
let turnIdx = 1;

pages.forEach(page => {
  const div = document.createElement('div');

  if (page.isSpread) {
    div.className = 'page';
    div.innerHTML = `<img src="${page.src}" style="width:100%;height:100%;object-fit:cover;">`;
    spreadTurnPages.push(turnIdx);
    turnIdx += 2; // spread occupies 2 slots
  } else {
    div.className = 'page';
    div.innerHTML = `<img src="${page.src}">`;
    turnIdx++;
  }

  book.appendChild(div);
});

// Pad to even
if (book.children.length % 2 !== 0) {
  const blank = document.createElement('div');
  blank.className = 'page blank';
  book.appendChild(blank);
}

const totalTurnPages = book.children.length;

$(document).ready(function() {
  $('#book').turn({
    width: bookW,
    height: bookH,
    autoCenter: true,
    display: 'double',
    acceleration: true,
    gradients: true,
    elevation: 50,
    when: {
      turned: function(e, page) { updateUI(page); }
    }
  });

  // Tell Turn.js which pages are double-page spreads
  spreadTurnPages.forEach(p => {
    $('#book').turn('pages', p, [p, p + 1]);
  });

  updateUI(1);

  $(document).keydown(function(e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') $('#book').turn('next');
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   $('#book').turn('previous');
  });

  document.getElementById('btn-next').addEventListener('click', () => $('#book').turn('next'));
  document.getElementById('btn-prev').addEventListener('click', () => $('#book').turn('previous'));

  let tx = 0;
  document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; });
  document.addEventListener('touchend', e => {
    const diff = tx - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 60) {
      if (diff > 0) $('#book').turn('next');
      else $('#book').turn('previous');
    }
  });
});

function updateUI(page) {
  document.getElementById('page-counter').textContent = `${Math.ceil(page/2)} / ${Math.ceil(totalTurnPages/2)}`;
  document.getElementById('progress-bar').style.width = `${(page / totalTurnPages) * 100}%`;
  document.getElementById('btn-prev').disabled = page <= 1;
  document.getElementById('btn-next').disabled = page >= totalTurnPages - 1;
}
</script>
</body>
</html>

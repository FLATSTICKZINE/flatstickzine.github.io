<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLAT STICK — Read Online</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jquery/3.7.1/jquery.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/turn.js/3/turn.min.js"></script>
<style>
@import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a1a1a;
  color: #fff;
  font-family: 'Courier Prime', monospace;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  background: #0a0a0a;
  border-bottom: 2px solid #333;
  padding: 12px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}

.topbar-title { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; }
.topbar-issue { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #999; }
.topbar-back  { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #999; text-decoration: none; }
.topbar-back:hover { color: #fff; }

.viewer {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow: hidden;
}

#book { box-shadow: 0 20px 80px rgba(0,0,0,0.8); }
#book .page { background: #f8f5f0; overflow: hidden; }
#book .page img { width: 100%; height: 100%; object-fit: cover; display: block; }
#book .page.blank { background: transparent !important; box-shadow: none !important; }

.controls {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 16px;
  flex-shrink: 0;
}

.ctrl-btn {
  width: 44px; height: 44px;
  border: 1px solid #444; background: #222; color: #fff;
  cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.12s;
  user-select: none;
}
.ctrl-btn:hover:not([disabled]) { background: #444; }
.ctrl-btn[disabled] { opacity: 0.25; cursor: default; }

.page-counter { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #999; min-width: 80px; text-align: center; }

.progress-wrap { width: 100%; max-width: 900px; margin-top: 10px; height: 2px; background: #333; }
.progress-bar  { height: 100%; background: #666; transition: width 0.3s ease; }

.hint { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: #444; margin-top: 8px; }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">Flat Stick</span>
  <span class="topbar-issue" id="topbar-issue">Issue —</span>
  <a href="index.html" class="topbar-back">&#8592; Back</a>
</div>

<div class="viewer">
  <div id="book"></div>
  <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
  <div class="controls">
    <button class="ctrl-btn" id="btn-prev">&#8592;</button>
    <span class="page-counter" id="page-counter">— / —</span>
    <button class="ctrl-btn" id="btn-next">&#8594;</button>
  </div>
  <div class="hint">Click page edges or use arrow keys to turn</div>
</div>

<script>
// ─────────────────────────────────────────────
// ISSUE DATA — add new issues here each week
// ─────────────────────────────────────────────
const issues = {
  "01": {
    label: "01",
    title: "Leaving Victoria",
    folder: "issue1",
    totalPages: 16,
    spreads: [8],
    skipPages: [9],
    singlePages: [1, 16],
  },
  "02": {
    label: "02",
    title: "Stuck in Broken Hill",
    folder: "issue2",
    totalPages: 20,
    spreads: [10],
    skipPages: [11],
    singlePages: [1, 20],
  },
  // "03": { label:"03", title:"Title", folder:"issue3", totalPages:16, spreads:[], skipPages:[], singlePages:[1,16] },
};

const params = new URLSearchParams(window.location.search);
const issueKey = params.get('i') || '01';
const issue = issues[issueKey] || issues['01'];

document.getElementById('topbar-issue').textContent = `Issue ${issue.label} — ${issue.title}`;
document.title = `FLAT STICK — Issue ${issue.label}`;

// Build pages array filtering skipped pages
const pages = Array.from({length: issue.totalPages}, (_, i) => ({
  num: i + 1,
  src: `${issue.folder}/${i + 1}.webp`,
  isSpread: issue.spreads.includes(i + 1),
  isSingle: issue.singlePages.includes(i + 1),
  skip: issue.skipPages.includes(i + 1),
})).filter(p => !p.skip);

// Calculate book size to fit viewport
const vw = window.innerWidth - 40;
const vh = window.innerHeight - 160;
const pageH = Math.min(vh, 680);
const pageW = Math.round(pageH / 1.414);
const bookW = pageW * 2;
const bookH = pageH;

const book = document.getElementById('book');
book.style.width = bookW + 'px';
book.style.height = bookH + 'px';

// Build Turn.js page elements
// Turn.js: page 1 is always on the RIGHT (front cover)
// Even total pages needed for proper book
const bookPages = [];

pages.forEach((page) => {
  if (page.isSpread) {
    bookPages.push({ src: page.src, half: 'left' });
    bookPages.push({ src: page.src, half: 'right' });
  } else {
    bookPages.push({ src: page.src });
  }
});

// Pad to even number with blank at end if needed
if (bookPages.length % 2 !== 0) {
  bookPages.push({ blank: true });
}

bookPages.forEach(p => {
  const div = document.createElement('div');
  div.className = 'page' + (p.blank ? ' blank' : '');

  if (!p.blank) {
    if (p.half === 'left') {
      div.innerHTML = `<img src="${p.src}" style="width:200%;height:100%;object-fit:cover;object-position:left center;">`;
    } else if (p.half === 'right') {
      div.innerHTML = `<img src="${p.src}" style="width:200%;height:100%;object-fit:cover;object-position:right center;transform:translateX(-50%);">`;
    } else {
      div.innerHTML = `<img src="${p.src}">`;
    }
  }

  book.appendChild(div);
});

// Init Turn.js
$(document).ready(function() {
  $('#book').turn({
    width: bookW,
    height: bookH,
    autoCenter: true,
    display: 'double',
    acceleration: true,
    gradients: true,
    elevation: 50,
    when: {
      turned: function(e, page) { updateUI(page); },
      start: function(e, pageObj, corner) {
        // prevent turning back past cover
        if (pageObj.page === 1 && (corner === 'tl' || corner === 'bl')) {
          e.preventDefault();
        }
      }
    }
  });



  updateUI(1);

  $(document).keydown(function(e) {
    if (e.key === 'ArrowRight' || e.key === 'ArrowDown') $('#book').turn('next');
    if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   $('#book').turn('previous');
  });

  document.getElementById('btn-next').addEventListener('click', () => $('#book').turn('next'));
  document.getElementById('btn-prev').addEventListener('click', () => $('#book').turn('previous'));

  // Swipe
  let tx = 0;
  document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; });
  document.addEventListener('touchend', e => {
    const diff = tx - e.changedTouches[0].clientX;
    if (Math.abs(diff) > 60) {
      if (diff > 0) $('#book').turn('next');
      else $('#book').turn('previous');
    }
  });
});

function updateUI(page) {
  const total = bookPages.length;
  document.getElementById('page-counter').textContent = `${Math.ceil(page/2)} / ${Math.ceil(total/2)}`;
  document.getElementById('progress-bar').style.width = `${(page / total) * 100}%`;
  document.getElementById('btn-prev').disabled = page <= 1;
  document.getElementById('btn-next').disabled = page >= total - 1;
}
</script>
</body>
</html>

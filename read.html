<!DOCTYPE html>

<style>
@import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a1a1a;
  color: #fff;
  font-family: 'Courier Prime', monospace;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  background: #0a0a0a;
  border-bottom: 2px solid #333;
  padding: 12px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.topbar-title { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; }
.topbar-issue { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #999; }
.topbar-back  { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #999; text-decoration: none; }
.topbar-back:hover { color: #fff; }

.viewer {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow: hidden;
}

.spread {
  display: flex;
  box-shadow: 0 20px 80px rgba(0,0,0,0.8);
  max-height: calc(100vh - 160px);
}

.page {
  background: #ffffff;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.page img {
  width: calc(100% - 16px);
  height: calc(100% - 16px);
  object-fit: cover;
  display: block;
  margin: 8px;
  background: #fff;
}

.page.blank {
  background: transparent;
  box-shadow: none;
}

.page.spread-img img {
  object-fit: contain;
}

.controls {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 16px;
  flex-shrink: 0;
}

.ctrl-btn {
  width: 44px; height: 44px;
  border: 1px solid #444; background: #222; color: #fff;
  cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.12s;
  user-select: none;
}
.ctrl-btn:hover:not([disabled]) { background: #444; }
.ctrl-btn[disabled] { opacity: 0.25; cursor: default; }

.page-counter { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #999; min-width: 80px; text-align: center; }
.progress-wrap { width: 100%; margin-top: 10px; height: 2px; background: #333; }
.progress-bar  { height: 100%; background: #666; transition: width 0.3s ease; }
.hint { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: #444; margin-top: 8px; }

/* ── TICKER ── */
.ticker {
  background: #0a0a0a;
  color: #fff;
  font-size: 10px;
  letter-spacing: 4px;
  padding: 7px 0;
  overflow: hidden;
  white-space: nowrap;
  text-transform: uppercase;
}
.ticker-inner {
  display: inline-block;
  animation: ticker 22s linear infinite;
}
@keyframes ticker {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* ── HEY DOWNLOAD OVERLAY ── */
.hey-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.85);
  z-index: 500;
  align-items: center;
  justify-content: center;
  flex-direction: column;
  gap: 24px;
}
.hey-overlay.open { display: flex; }
.hey-overlay img { max-width: 340px; width: 80%; }
.hey-download-btn {
  padding: 16px 36px;
  background: #fff;
  color: #0a0a0a;
  font-family: 'Courier Prime', monospace;
  font-size: 12px;
  letter-spacing: 4px;
  text-transform: uppercase;
  text-decoration: none;
  border: none;
  cursor: pointer;
  display: inline-block;
}
.hey-close {
  position: absolute;
  top: 20px;
  right: 24px;
  color: #fff;
  font-size: 24px;
  cursor: pointer;
  opacity: 0.6;
  background: none;
  border: none;
  font-family: monospace;
}
.hey-close:hover { opacity: 1; }

</style>
</head>

    <img src="flatstickzineheader.png" alt="Flat Stick" style="height:22px;width:auto;display:inline-block;vertical-align:middle;margin-right:-8px;">

  </div>

<script>
const issues = {
  "01": {
    label: "01", title: "Leaving Victoria",
    folder: "issue1", totalPages: 16,
    spreads: [8], skipPages: [9], singlePages: [1, 16],
  },
  "02": {
    label: "02", title: "Stuck in Broken Hill",
    folder: "issue2", totalPages: 20,
    spreads: [10], skipPages: [11], singlePages: [1, 20],
  },
};

// Token-based access — tokens prevent URL guessing
const tokenMap = {
  '6801a92c7913': '01',
  '6acb2f594059': '02',
  'd211f2eea17c': '03',
};

const params = new URLSearchParams(window.location.search);
const token = params.get('t');
const issueKey = tokenMap[token] || null;

if (!issueKey) {
  document.body.innerHTML = '<div style="display:flex;align-items:center;justify-content:center;height:100vh;color:#fff;font-family:monospace;font-size:14px;letter-spacing:2px;text-transform:uppercase;">Access denied — purchase required</div>';
  throw new Error('Invalid token');
}

const issue = issues[issueKey];

document.getElementById('topbar-issue').textContent = `Issue ${issue.label} — ${issue.title}`;
document.title = `FLAT STICK — Issue ${issue.label}`;

function openHeyOverlay() {
  const link = document.getElementById('hey-download-link');
  link.href = `issue${issueKey}.pdf`;
  link.download = `FlatStick_Issue${issueKey}.pdf`;
  document.getElementById('hey-overlay').classList.add('open');
}

const pages = Array.from({length: issue.totalPages}, (_, i) => ({
  num: i + 1,
  src: `${issue.folder}/${i + 1}.webp`,
  isSpread: issue.spreads.includes(i + 1),
  isSingle: issue.singlePages.includes(i + 1),
  skip: issue.skipPages.includes(i + 1),
})).filter(p => !p.skip);

const total = pages.length;
const pageH = Math.min(window.innerHeight - 160, 680);
const pageW = Math.round(pageH / 1.414);

let current = 0; // index into pages array
const spreadEl = document.getElementById('spread');
const counter  = document.getElementById('page-counter');
const progress = document.getElementById('progress-bar');
const btnPrev  = document.getElementById('btn-prev');
const btnNext  = document.getElementById('btn-next');

const isMobile = () => window.innerWidth <= 600;

function render() {
  const page = pages[current];
  spreadEl.innerHTML = '';

  if (page.isSpread) {
    // Full landscape image — natural size, no cropping
    const spreadW = isMobile() ? (window.innerWidth - 24) : (pageW * 2);
    const spreadH = Math.round(spreadW / 1.5); // landscape ratio
    spreadEl.style.width = spreadW + 'px';
    spreadEl.style.height = spreadH + 'px';
    const div = document.createElement('div');
    div.className = 'page spread-img';
    div.style.width = '100%';
    div.style.height = spreadH + 'px';
    div.innerHTML = `<img src="${page.src}" style="width:100%;height:100%;object-fit:contain;background:#f8f5f0;">`;
    spreadEl.appendChild(div);
  } else if (isMobile()) {
    // Mobile — always single page regardless of cover/back cover
    spreadEl.style.width = (window.innerWidth - 24) + 'px';
    spreadEl.style.height = Math.round((window.innerWidth - 24) * 1.414) + 'px';
    const single = document.createElement('div');
    single.className = 'page';
    single.style.width = '100%';
    single.style.height = '100%';
    single.innerHTML = `<img src="${page.src}" loading="eager">`;
    spreadEl.appendChild(single);
  } else if (page.isSingle) {
    // Cover or back cover — show alone on correct side
    const isFirst = current === 0;
    spreadEl.style.width = (pageW * 2) + 'px';
    spreadEl.style.height = pageH + 'px';

    const blank = document.createElement('div');
    blank.className = 'page blank';
    blank.style.width = pageW + 'px';
    blank.style.height = pageH + 'px';

    const single = document.createElement('div');
    single.className = 'page';
    single.style.width = pageW + 'px';
    single.style.height = pageH + 'px';
    single.innerHTML = `<img src="${page.src}">`;

    if (isFirst) {
      spreadEl.appendChild(blank);
      spreadEl.appendChild(single);
    } else {
      spreadEl.appendChild(single);
      spreadEl.appendChild(blank);
    }
  } else {
    // Normal two-page spread
    const next = pages[current + 1];
    spreadEl.style.width = (pageW * 2) + 'px';
    spreadEl.style.height = pageH + 'px';

    const left = document.createElement('div');
    left.className = 'page';
    left.style.width = pageW + 'px';
    left.style.height = pageH + 'px';
    left.innerHTML = `<img src="${page.src}">`;
    spreadEl.appendChild(left);

    const right = document.createElement('div');
    right.className = 'page';
    right.style.width = pageW + 'px';
    right.style.height = pageH + 'px';
    if (next) right.innerHTML = `<img src="${next.src}">`;
    spreadEl.appendChild(right);
  }

  // Update counter and progress
  const displayPage = page.isSpread ? current + 1 : current + 1;
  counter.textContent = `${current + 1} / ${total}`;
  progress.style.width = `${((current + 1) / total) * 100}%`;
  btnPrev.disabled = current === 0;
  // On desktop, last spread shows back cover + blank so stop one earlier
  // On mobile, go all the way to last page
  btnNext.disabled = isMobile() ? current >= total - 1 : current >= total - 1;

  // Preload next 2 pages only
  [current + 1, current + 2, current + 3].forEach(i => {
    if (pages[i]) { const img = new Image(); img.src = pages[i].src; }
  });
}

function next() {
  const page = pages[current];
  if (isMobile()) {
    current = Math.min(current + 1, total - 1);
  } else if (page.isSpread || page.isSingle) {
    current++;
  } else {
    // If jumping by 2 would skip the last page, just go to last page
    const nextIdx = current + 2;
    current = nextIdx >= total ? total - 1 : nextIdx;
  }
  render();
}

function prev() {
  if (current === 0) return;
  if (isMobile()) {
    current = Math.max(current - 1, 0);
  } else {
    const page = pages[current];
    const prevPage = pages[current - 1];
    if (prevPage && (prevPage.isSpread || prevPage.isSingle)) {
      current--;
    } else {
      current = Math.max(current - 2, 0);
    }
  }
  render();
}

btnNext.addEventListener('click', next);
btnPrev.addEventListener('click', prev);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next();
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   prev();
});

let tx = 0;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; });
document.addEventListener('touchend', e => {
  const diff = tx - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 60) { if (diff > 0) next(); else prev(); }
});

render();
</script>

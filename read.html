<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLAT STICK — Read Online</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap');

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: #1a1a1a;
  color: #fff;
  font-family: 'Courier Prime', monospace;
  height: 100vh;
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.topbar {
  background: #0a0a0a;
  border-bottom: 2px solid #333;
  padding: 12px 30px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  flex-shrink: 0;
}
.topbar-title { font-size: 11px; letter-spacing: 4px; text-transform: uppercase; }
.topbar-issue { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #999; }
.topbar-back  { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #999; text-decoration: none; }
.topbar-back:hover { color: #fff; }

.viewer {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  padding: 20px;
  overflow: hidden;
}

.spread {
  display: flex;
  box-shadow: 0 20px 80px rgba(0,0,0,0.8);
  max-height: calc(100vh - 160px);
}

.page {
  background: #f8f5f0;
  overflow: hidden;
  display: flex;
  align-items: center;
  justify-content: center;
}

.page img {
  width: 100%;
  height: 100%;
  object-fit: cover;
  display: block;
}

.page.blank {
  background: transparent;
  box-shadow: none;
}

.page.spread-img img {
  object-fit: contain;
}

.controls {
  display: flex;
  align-items: center;
  gap: 20px;
  margin-top: 16px;
  flex-shrink: 0;
}

.ctrl-btn {
  width: 44px; height: 44px;
  border: 1px solid #444; background: #222; color: #fff;
  cursor: pointer; font-size: 18px;
  display: flex; align-items: center; justify-content: center;
  transition: background 0.12s;
  user-select: none;
}
.ctrl-btn:hover:not([disabled]) { background: #444; }
.ctrl-btn[disabled] { opacity: 0.25; cursor: default; }

.page-counter { font-size: 10px; letter-spacing: 3px; text-transform: uppercase; color: #999; min-width: 80px; text-align: center; }
.progress-wrap { width: 100%; margin-top: 10px; height: 2px; background: #333; }
.progress-bar  { height: 100%; background: #666; transition: width 0.3s ease; }
.hint { font-size: 9px; letter-spacing: 3px; text-transform: uppercase; color: #444; margin-top: 8px; }
</style>
</head>
<body>

<div class="topbar">
  <span class="topbar-title">Flat Stick</span>
  <span class="topbar-issue" id="topbar-issue">Issue —</span>
  <a href="index.html" class="topbar-back">&#8592; Back</a>
</div>

<div class="viewer">
  <div class="spread" id="spread"></div>
  <div class="progress-wrap"><div class="progress-bar" id="progress-bar"></div></div>
  <div class="controls">
    <button class="ctrl-btn" id="btn-prev">&#8592;</button>
    <span class="page-counter" id="page-counter">— / —</span>
    <button class="ctrl-btn" id="btn-next">&#8594;</button>
  </div>
  <div class="hint">Arrow keys or swipe to turn pages</div>
</div>

<script>
const issues = {
  "01": {
    label: "01", title: "Leaving Victoria",
    folder: "issue1", totalPages: 16,
    spreads: [8], skipPages: [9], singlePages: [1, 16],
  },
  "02": {
    label: "02", title: "Stuck in Broken Hill",
    folder: "issue2", totalPages: 20,
    spreads: [10], skipPages: [11], singlePages: [1, 20],
  },
};

const params = new URLSearchParams(window.location.search);
const issueKey = params.get('i') || '01';
const issue = issues[issueKey] || issues['01'];

document.getElementById('topbar-issue').textContent = `Issue ${issue.label} — ${issue.title}`;
document.title = `FLAT STICK — Issue ${issue.label}`;

const pages = Array.from({length: issue.totalPages}, (_, i) => ({
  num: i + 1,
  src: `${issue.folder}/${i + 1}.webp`,
  isSpread: issue.spreads.includes(i + 1),
  isSingle: issue.singlePages.includes(i + 1),
  skip: issue.skipPages.includes(i + 1),
})).filter(p => !p.skip);

const total = pages.length;
const pageH = Math.min(window.innerHeight - 160, 680);
const pageW = Math.round(pageH / 1.414);

let current = 0; // index into pages array
const spreadEl = document.getElementById('spread');
const counter  = document.getElementById('page-counter');
const progress = document.getElementById('progress-bar');
const btnPrev  = document.getElementById('btn-prev');
const btnNext  = document.getElementById('btn-next');

function render() {
  const page = pages[current];
  spreadEl.innerHTML = '';

  if (page.isSpread) {
    // Full landscape image — show alone at full width
    spreadEl.style.width = (pageW * 2) + 'px';
    spreadEl.style.height = pageH + 'px';
    const div = document.createElement('div');
    div.className = 'page spread-img';
    div.style.width = '100%';
    div.style.height = pageH + 'px';
    div.innerHTML = `<img src="${page.src}">`;
    spreadEl.appendChild(div);
  } else if (page.isSingle) {
    // Cover or back cover — show alone on correct side
    const isFirst = current === 0;
    spreadEl.style.width = (pageW * 2) + 'px';
    spreadEl.style.height = pageH + 'px';

    const blank = document.createElement('div');
    blank.className = 'page blank';
    blank.style.width = pageW + 'px';
    blank.style.height = pageH + 'px';

    const single = document.createElement('div');
    single.className = 'page';
    single.style.width = pageW + 'px';
    single.style.height = pageH + 'px';
    single.innerHTML = `<img src="${page.src}">`;

    if (isFirst) {
      spreadEl.appendChild(blank);
      spreadEl.appendChild(single);
    } else {
      spreadEl.appendChild(single);
      spreadEl.appendChild(blank);
    }
  } else {
    // Normal two-page spread
    const next = pages[current + 1];
    spreadEl.style.width = (pageW * 2) + 'px';
    spreadEl.style.height = pageH + 'px';

    const left = document.createElement('div');
    left.className = 'page';
    left.style.width = pageW + 'px';
    left.style.height = pageH + 'px';
    left.innerHTML = `<img src="${page.src}">`;
    spreadEl.appendChild(left);

    const right = document.createElement('div');
    right.className = 'page';
    right.style.width = pageW + 'px';
    right.style.height = pageH + 'px';
    if (next) right.innerHTML = `<img src="${next.src}">`;
    spreadEl.appendChild(right);
  }

  // Update counter and progress
  const displayPage = page.isSpread ? current + 1 : current + 1;
  counter.textContent = `${current + 1} / ${total}`;
  progress.style.width = `${((current + 1) / total) * 100}%`;
  btnPrev.disabled = current === 0;
  btnNext.disabled = current >= total - 1 || (!page.isSpread && !page.isSingle && current + 1 >= total - 1);

  // Preload next
  if (pages[current + 2]) { const img = new Image(); img.src = pages[current + 2].src; }
}

function next() {
  const page = pages[current];
  if (page.isSpread || page.isSingle) {
    current++;
  } else {
    current = Math.min(current + 2, total - 1);
  }
  render();
}

function prev() {
  const page = pages[current];
  if (current === 0) return;
  // Go back 2 unless previous was a spread/single
  const prevPage = pages[current - 1];
  if (prevPage && (prevPage.isSpread || prevPage.isSingle)) {
    current--;
  } else {
    current = Math.max(current - 2, 0);
  }
  render();
}

btnNext.addEventListener('click', next);
btnPrev.addEventListener('click', prev);

document.addEventListener('keydown', e => {
  if (e.key === 'ArrowRight' || e.key === 'ArrowDown') next();
  if (e.key === 'ArrowLeft'  || e.key === 'ArrowUp')   prev();
});

let tx = 0;
document.addEventListener('touchstart', e => { tx = e.touches[0].clientX; });
document.addEventListener('touchend', e => {
  const diff = tx - e.changedTouches[0].clientX;
  if (Math.abs(diff) > 60) { if (diff > 0) next(); else prev(); }
});

render();
</script>
</body>
</html>

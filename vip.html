<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>VIP Lounge</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Courier Prime', monospace;
            background: #0a0a0a;
            color: #e0e0e0;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
        }

        .login-box {
            background: #1a1a1a;
            border: 2px solid #333;
            padding: 40px;
            text-align: center;
        }

        .login-box h1 {
            font-size: 28px;
            margin-bottom: 10px;
            font-weight: bold;
        }

        .login-box p {
            font-size: 12px;
            color: #888;
            margin-bottom: 30px;
            letter-spacing: 1px;
        }

        input[type="password"] {
            width: 100%;
            padding: 12px;
            margin-bottom: 20px;
            background: #0a0a0a;
            border: 1px solid #444;
            color: #e0e0e0;
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
        }

        input[type="password"]:focus {
            outline: none;
            border-color: #666;
            background: #111;
        }

        button {
            width: 100%;
            padding: 12px;
            background: #e0e0e0;
            color: #0a0a0a;
            border: none;
            font-family: 'Courier Prime', monospace;
            font-size: 14px;
            font-weight: bold;
            cursor: pointer;
            letter-spacing: 1px;
        }

        button:hover {
            background: #fff;
        }

        button:active {
            background: #ccc;
        }

        .error {
            color: #ff6b6b;
            font-size: 12px;
            margin-top: 15px;
            display: none;
        }

        .loading {
            display: none;
            font-size: 12px;
            color: #888;
            margin-top: 15px;
        }

        /* VIP Lounge Styles */
        .lounge {
            display: none;
        }

        .lounge h1 {
            font-size: 32px;
            margin-bottom: 30px;
            text-align: center;
            font-weight: bold;
        }

        .zine-grid {
            display: grid;
            grid-template-columns: 1fr;
            gap: 20px;
            margin-bottom: 30px;
        }

        .zine-link {
            background: #1a1a1a;
            border: 2px solid #333;
            padding: 25px;
            text-decoration: none;
            color: #e0e0e0;
            transition: all 0.2s;
            text-align: center;
        }

        .zine-link:hover {
            background: #222;
            border-color: #555;
        }

        .zine-link h2 {
            font-size: 18px;
            margin-bottom: 8px;
            font-weight: bold;
        }

        .zine-link p {
            font-size: 12px;
            color: #888;
        }

        .logout-btn {
            width: 100%;
            padding: 12px;
            background: #333;
            color: #e0e0e0;
            border: 1px solid #555;
            font-family: 'Courier Prime', monospace;
            font-size: 12px;
            cursor: pointer;
            letter-spacing: 1px;
        }

        .logout-btn:hover {
            background: #444;
        }
    </style>
</head>
<body>
    <div class="container">
        <!-- Login Box -->
        <div id="loginBox" class="login-box">
            <h1>VIP LOUNGE</h1>
            <p>PASSWORD REQUIRED</p>
            <form id="loginForm">
                <input 
                    type="password" 
                    id="passwordInput" 
                    placeholder="enter password" 
                    required
                >
                <button type="submit">ENTER</button>
            </form>
            <div class="loading" id="loading">verifying...</div>
            <div class="error" id="error">incorrect password</div>
        </div>

        <!-- VIP Lounge -->
        <div id="lounge" class="lounge">
            <h1>VIP LOUNGE</h1>
            <div class="zine-grid">
                <a href="read.html?token=6801a92c7913" class="zine-link">
                    <h2>ISSUE 01</h2>
                    <p>Leaving Victoria</p>
                </a>
                <a href="read.html?token=6acb2f594059" class="zine-link">
                    <h2>ISSUE 02</h2>
                    <p>Stuck in Broken Hill</p>
                </a>
                <a href="read.html?token=d211f2eea17c" class="zine-link">
                    <h2>ISSUE 03</h2>
                    <p>???</p>
                </a>
            </div>
            <button class="logout-btn" onclick="logout()">LOGOUT</button>
        </div>
    </div>

    <script>
        const DEPLOYMENT_URL = "https://script.google.com/macros/s/AKfycbwGa2vHXSFF3d3ifjjboYNZRYLhyBPxKZ309kkurOUCT_KeJT273ABVmBg7Uxzt8QbUyA/exec";

        const loginForm = document.getElementById('loginForm');
        const loginBox = document.getElementById('loginBox');
        const lounge = document.getElementById('lounge');
        const errorMsg = document.getElementById('error');
        const loadingMsg = document.getElementById('loading');
        const passwordInput = document.getElementById('passwordInput');

        loginForm.addEventListener('submit', async (e) => {
            e.preventDefault();
            const password = passwordInput.value;

            errorMsg.style.display = 'none';
            loadingMsg.style.display = 'block';

            try {
                const response = await fetch(DEPLOYMENT_URL, {
                    method: 'POST',
                    body: new URLSearchParams({ password: password })
                });

                const data = await response.json();

                if (data.success) {
                    loadingMsg.style.display = 'none';
                    loginBox.style.display = 'none';
                    lounge.style.display = 'block';
                } else {
                    loadingMsg.style.display = 'none';
                    errorMsg.style.display = 'block';
                    passwordInput.value = '';
                    passwordInput.focus();
                }
            } catch (err) {
                console.error('Error:', err);
                loadingMsg.style.display = 'none';
                errorMsg.style.display = 'block';
                errorMsg.textContent = 'connection error';
            }
        });

        function logout() {
            loginBox.style.display = 'block';
            lounge.style.display = 'none';
            passwordInput.value = '';
            errorMsg.style.display = 'none';
            passwordInput.focus();
        }
    </script>
</body>
</html>

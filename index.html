<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>FLAT STICK</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Courier+Prime:ital,wght@0,400;0,700;1,400&display=swap');

:root {
  --black: #0a0a0a;
  --white: #ffffff;
  --grey: #999;
  --mid: #444;
  --border: 2px solid var(--black);
}

* { margin: 0; padding: 0; box-sizing: border-box; }

body {
  background: var(--white);
  color: var(--black);
  font-family: 'Courier Prime', monospace;
  overflow-x: hidden;
  cursor: crosshair;
}

/* ── TICKER ── */
.ticker {
  background: var(--black);
  color: var(--white);
  font-size: 10px;
  letter-spacing: 4px;
  padding: 7px 0;
  overflow: hidden;
  white-space: nowrap;
  text-transform: uppercase;
}
.ticker-inner {
  display: inline-block;
  animation: ticker 22s linear infinite;
}
@keyframes ticker {
  0%   { transform: translateX(0); }
  100% { transform: translateX(-50%); }
}

/* ── HEADER ── */
header {
  border-bottom: 3px solid var(--black);
  padding: 28px 40px 0;
}

.header-top {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  margin-bottom: 20px;
}

.header-meta {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  line-height: 2;
  color: var(--mid);
}

/* Title reel system */
h1 {
  display: flex;
  justify-content: center;
  align-items: center;
  gap: 40px;
  padding: 10px 0 28px;
}

.title-word {
  width: clamp(240px, 34vw, 560px);
  height: clamp(72px, 10vw, 148px);
  overflow: hidden;
}

.reel {
  display: flex;
  flex-direction: column;
  transition: transform 0.3s ease-in-out;
}

.reel img {
  width: 100%;
  height: clamp(72px, 10vw, 148px);
  object-fit: contain;
  flex-shrink: 0;
}

/* ── NAV ── */
nav {
  display: flex;
  border-top: 2px solid var(--black);
  margin: 0 -40px;
}

nav a {
  flex: 1;
  text-align: center;
  padding: 11px;
  font-size: 10px;
  letter-spacing: 4px;
  text-transform: uppercase;
  text-decoration: none;
  color: var(--white);
  border-right: 1px solid #333;
  background: var(--black);
  transition: background 0.12s, color 0.12s;
  display: flex;
  align-items: center;
  justify-content: center;
}

nav a:last-child { border-right: none; }
nav a:hover { background: #333; }

/* ── RULED DIVIDER ── */
.ruled {
  border-top: 1px solid var(--black);
  border-bottom: 1px solid var(--black);
  padding: 7px 40px;
  font-size: 9px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--grey);
  overflow: hidden;
  white-space: nowrap;
}






/* ── LATEST ISSUE BAND ── */
.latest-band {
  background: var(--black);
  color: var(--white);
  padding: 10px 40px;
  font-size: 10px;
  letter-spacing: 4px;
  text-transform: uppercase;
  display: flex;
  justify-content: space-between;
  align-items: center;
  border-bottom: 3px solid var(--black);
}

.latest-band a {
  color: var(--white);
  text-decoration: none;
  border-bottom: 1px solid rgba(255,255,255,0.4);
  padding-bottom: 1px;
}

/* ── SHOP ── */
#shop {
  border-bottom: 3px solid var(--black);
}

.section-header {
  border-bottom: 2px solid var(--black);
  padding: 14px 40px;
  display: flex;
  align-items: baseline;
  gap: 16px;
}

.section-title {
  font-size: 11px;
  letter-spacing: 5px;
  text-transform: uppercase;
  font-weight: 700;
}

.section-sub {
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  color: var(--grey);
}

.shop-issues {
  display: flex;
  overflow-x: auto;
  gap: 0;
  scrollbar-width: none;
  -webkit-overflow-scrolling: touch;
}

.shop-issues::-webkit-scrollbar { display: none; }

.shop-card {
  flex-shrink: 0;
  width: 260px;
  border-right: 2px solid var(--black);
  position: relative;
}

.shop-card:last-child { border-right: none; }

.shop-card-cover {
  width: 100%;
  aspect-ratio: 3/4;
  object-fit: cover;
  display: block;
  margin-bottom: 20px;
  border: 1px solid #ccc;
  filter: grayscale(15%);
}

.btn {
  display: inline-block;
  padding: 11px 22px;
  font-family: 'Courier Prime', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  text-decoration: none;
  border: var(--border);
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
  background: var(--white);
  color: var(--black);
  margin-right: 8px;
  margin-bottom: 8px;
}

.btn:hover { background: var(--black); color: var(--white); }
.btn-ghost { opacity: 0.4; cursor: default; }
.btn-ghost:hover { background: var(--white); color: var(--black); }

/* ── ABOUT ── */
#about {
  display: grid;
  grid-template-columns: 180px 1fr;
  border-bottom: 3px solid var(--black);
}

.about-sidebar {
  border-right: 3px solid var(--black);
  padding: 40px 28px;
  display: flex;
  align-items: flex-start;
  justify-content: center;
}

.about-sidebar .section-title {
  writing-mode: vertical-rl;
  transform: rotate(180deg);
  letter-spacing: 8px;
}

.about-body {
  padding: 48px 56px;
}

.about-body p {
  font-size: 14px;
  line-height: 2;
  color: var(--mid);
  margin-bottom: 18px;
  max-width: 520px;
}

.about-body p:first-child {
  font-size: 18px;
  color: var(--black);
  font-style: italic;
}

/* ── CONTACT ── */
#contact {
  padding: 48px 40px;
  text-align: center;
  border-bottom: 3px solid var(--black);
}

.contact-label {
  font-size: 9px;
  letter-spacing: 5px;
  text-transform: uppercase;
  color: var(--grey);
  margin-bottom: 10px;
}

.contact-addr {
  font-size: 22px;
  letter-spacing: 3px;
  font-weight: 700;
}

/* ── FOOTER ── */
footer {
  background: var(--black);
  color: var(--white);
  padding: 28px 40px;
  display: flex;
  justify-content: space-between;
  align-items: center;
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
}

/* ── MOBILE ── */
@media (max-width: 680px) {
  header { padding: 20px 20px 0; }
  nav { margin: 0 -20px; }
  
  .issue-panel { border-right: none; border-bottom: 2px solid var(--black); }
  .preview-strip { transform: translateY(0); position: static; border-top: 2px solid var(--black); }
  .preview-strip img { height: 90px; }
  #about { grid-template-columns: unset; display: flex; flex-direction: row; }
  .about-sidebar { border-right: none; border-bottom: 3px solid var(--black); padding: 24px; }
  .about-sidebar .section-title { writing-mode: horizontal-tb; transform: none; }
  .about-body { padding: 32px 20px; }
  .about-van-wrap { flex-direction: row !important; align-items: flex-start; }
  .van-road { min-height: 200px; width: 50px; }
  .about-content-wrap { padding: 16px; }
  .about-content-wrap img { max-width: 100% !important; }
  .ruled, #contact, footer { padding-left: 20px; padding-right: 20px; }
  footer { flex-direction: column; gap: 10px; text-align: center; }
  .latest-band { flex-direction: column; gap: 8px; padding: 14px 20px; }
  .section-header { padding: 14px 20px; }
  .shop-card { padding: 24px 20px; }
}


.issue-actions {
  padding: 16px 20px;
  border-top: 1px solid var(--black);
  display: flex;
  flex-direction: column;
  gap: 8px;
  background: var(--white);
}

.btn-add-cart {
  display: block;
  width: 100%;
  padding: 10px;
  font-family: 'Courier Prime', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  border: 2px solid var(--black);
  background: var(--white);
  color: var(--black);
  cursor: pointer;
  transition: background 0.12s, color 0.12s;
  text-align: center;
}
.btn-add-cart:hover { background: var(--black); color: var(--white); }
.btn-add-cart.in-cart { background: var(--black); color: var(--white); }

.btn-buy-now {
  display: block;
  width: 100%;
  padding: 10px;
  font-family: 'Courier Prime', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  border: 2px solid var(--black);
  background: var(--black);
  color: var(--white);
  cursor: pointer;
  text-decoration: none;
  text-align: center;
  transition: opacity 0.12s;
}
.btn-buy-now:hover { opacity: 0.8; }

.pdf-btn {
  display: block;
  width: 100%;
  padding: 8px;
  font-family: 'Courier Prime', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  border: 1px solid #ccc;
  background: var(--white);
  color: var(--mid);
  cursor: pointer;
  text-decoration: none;
  text-align: center;
  transition: background 0.12s;
}
.pdf-btn:hover { background: #f0f0f0; }

/* ── ORDER MODAL ── */
.modal-overlay {
  display: none;
  position: fixed;
  inset: 0;
  background: rgba(0,0,0,0.7);
  z-index: 1000;
  align-items: center;
  justify-content: center;
  padding: 20px;
}
.modal-overlay.open { display: flex; }

.modal {
  background: #fff;
  max-width: 560px;
  width: 100%;
  max-height: 90vh;
  overflow-y: auto;
  border: 3px solid #0a0a0a;
}

.modal-header {
  background: #0a0a0a;
  color: #fff;
  padding: 16px 24px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.modal-header h2 {
  font-size: 11px;
  letter-spacing: 4px;
  text-transform: uppercase;
  font-weight: 700;
}

.modal-close {
  background: none;
  border: none;
  color: #fff;
  font-size: 20px;
  cursor: pointer;
  opacity: 0.7;
  font-family: monospace;
}
.modal-close:hover { opacity: 1; }

.modal-body { padding: 24px; }

.pricing-guide {
  background: #f5f2ee;
  border: 1px solid #ddd;
  padding: 16px;
  margin-bottom: 24px;
  font-size: 11px;
  letter-spacing: 1px;
  line-height: 2;
}

.pricing-guide strong {
  display: block;
  font-size: 9px;
  letter-spacing: 4px;
  text-transform: uppercase;
  margin-bottom: 8px;
  color: #999;
}

.form-group {
  margin-bottom: 18px;
}

.form-group label {
  display: block;
  font-size: 9px;
  letter-spacing: 3px;
  text-transform: uppercase;
  margin-bottom: 6px;
  color: #444;
}

.form-group input,
.form-group textarea,
.form-group select {
  width: 100%;
  padding: 10px 12px;
  border: 2px solid #0a0a0a;
  font-family: 'Courier Prime', monospace;
  font-size: 13px;
  background: #fff;
  outline: none;
}

.form-group textarea { height: 80px; resize: vertical; }

.issues-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
  margin-top: 6px;
}

.issue-check {
  border: 2px solid #ddd;
  padding: 10px 12px;
  cursor: pointer;
  transition: border-color 0.12s, background 0.12s;
  display: flex;
  align-items: center;
  gap: 8px;
  font-size: 11px;
  letter-spacing: 1px;
  user-select: none;
}

.issue-check input[type="checkbox"] { 
  width: 16px; 
  height: 16px;
  min-width: 16px;
  margin: 0; 
  cursor: pointer;
  accent-color: #0a0a0a;
}
.issue-check:has(input:checked) { border-color: #0a0a0a; background: #f5f2ee; }

.modal-footer {
  padding: 16px 24px;
  border-top: 2px solid #0a0a0a;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.order-total {
  font-size: 13px;
  letter-spacing: 2px;
}

.order-total strong { font-size: 22px; font-weight: 700; }
.order-saving { font-size: 10px; color: #999; letter-spacing: 1px; }

.btn-order {
  padding: 14px 28px;
  background: #0a0a0a;
  color: #fff;
  font-family: 'Courier Prime', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  border: none;
  cursor: pointer;
  transition: opacity 0.12s;
}
.btn-order:hover { opacity: 0.8; }

/* Issue card order button */
.issue-actions {
  padding: 14px 16px;
  border-top: 1px solid #0a0a0a;
  background: #fff;
}

.btn-place-order {
  display: block;
  width: 100%;
  padding: 10px;
  font-family: 'Courier Prime', monospace;
  font-size: 10px;
  letter-spacing: 3px;
  text-transform: uppercase;
  border: 2px solid #0a0a0a;
  background: #0a0a0a;
  color: #fff;
  cursor: pointer;
  text-align: center;
  transition: opacity 0.12s;
  margin-bottom: 6px;
}
.btn-place-order:hover { opacity: 0.8; }

.pdf-btn {
  display: block;
  width: 100%;
  padding: 8px;
  font-family: 'Courier Prime', monospace;
  font-size: 9px;
  letter-spacing: 2px;
  text-transform: uppercase;
  border: 1px solid #ccc;
  background: #fff;
  color: #444;
  cursor: pointer;
  text-decoration: none;
  text-align: center;
  transition: background 0.12s;
  margin-bottom: 6px;
}
.pdf-btn:hover { background: #f0f0f0; }


/* ── VAN ANIMATION ── */
.about-van-wrap {
  display: flex;
  border-bottom: 3px solid var(--black);
}

.van-road {
  width: 80px;
  flex-shrink: 0;
  border-right: 3px solid var(--black);
  position: relative;
  overflow: hidden;
  min-height: 400px;
}

.van-line {
  position: absolute;
  left: 50%;
  top: 0;
  bottom: 0;
  width: 2px;
  background: repeating-linear-gradient(
    to bottom,
    var(--black) 0px,
    var(--black) 20px,
    transparent 20px,
    transparent 40px
  );
  transform: translateX(-50%);
}

.van-img {
  position: absolute;
  bottom: -80px;
  left: 50%;
  transform: translateX(-50%) rotate(-90deg);
  width: 56px;
  animation: van-drive 5s linear infinite;
}

@keyframes van-drive {
  0%   { bottom: -80px; opacity: 1; }
  80%  { bottom: 110%; opacity: 1; }
  81%  { bottom: 110%; opacity: 0; }
  99%  { bottom: -80px; opacity: 0; }
  100% { bottom: -80px; opacity: 1; }
}

.about-content-wrap {
  flex: 1;
  padding: 40px;
  display: flex;
  justify-content: center;
  align-items: center;
  text-align: center;
}


/* ── HORIZONTAL VAN ── */
.van-road-h {
  border-bottom: 3px solid var(--black);
  position: relative;
  height: 70px;
  overflow: hidden;
  background: var(--white);
}

.van-line-h {
  position: absolute;
  top: 50%;
  left: 0;
  right: 0;
  height: 2px;
  background: repeating-linear-gradient(
    to right,
    var(--black) 0px,
    var(--black) 20px,
    transparent 20px,
    transparent 40px
  );
  transform: translateY(-50%);
}

.van-img-h {
  position: absolute;
  top: 50%;
  left: -80px;
  transform: translateY(-50%);
  height: 50px;
  width: auto;
  animation: van-drive-h 5s linear infinite; animation-delay: -2.5s;
}

@keyframes van-drive-h {
  0%   { left: -80px; opacity: 0; }
  2%   { opacity: 1; }
  88%  { opacity: 1; }
  90%  { left: 110%; opacity: 0; }
  100% { left: -80px; opacity: 0; }
}

</style>
</head>

// ── ORDER MODAL JS ──
const BUNDLE_PRICES = { 1: 10, 2: 17, 3: 24, 4: 30 };
const FORMSPREE_URL = "https://formspree.io/f/xzdjjwzy";

function calcTotal(printCount) {
  return BUNDLE_PRICES[Math.min(printCount, 4)] || (printCount * 10);
}

function openOrder(preselect) {
  const overlay = document.getElementById('order-overlay');
  overlay.classList.add('open');
  if (preselect) {
    const cb = document.querySelector(`input[name="issues"][value="${preselect}"]`);
    if (cb) cb.checked = true;
  }
  updateOrderTotal();
}

function closeOrder() {
  document.getElementById('order-overlay').classList.remove('open');
}

function updateOrderTotal() {
  const checked = document.querySelectorAll('input[name="issues"]:checked');
  const count = checked.length;
  const total = calcTotal(count);
  const saving = (count * 10) - total;
  document.getElementById('order-total-val').textContent = count > 0 ? `$${total}` : '$0';
  document.getElementById('order-saving').textContent = saving > 0 ? `saving $${saving} on postage` : '';
}



document.addEventListener('DOMContentLoaded', () => {
  // Populate modal issue checkboxes
  const modalIssues = document.getElementById('modal-issues');
  if (modalIssues) {
    issues.filter(i => i.available).forEach(iss => {
      const label = document.createElement('label');
      label.className = 'issue-check';
      label.innerHTML = `<input type="checkbox" name="issues" value="${iss.label}"> Issue ${iss.label} — ${iss.title}`;
      modalIssues.appendChild(label);
      label.querySelector('input').addEventListener('change', updateOrderTotal);
    });
  }






  // Form submit
  document.getElementById('order-form').addEventListener('submit', async e => {
    e.preventDefault();
    const form = e.target;
    const name     = form.querySelector('[name="name"]').value.trim();
    const street   = form.querySelector('[name="street"]').value.trim();
    const suburb   = form.querySelector('[name="suburb"]').value.trim();
    const state    = form.querySelector('[name="state"]').value;
    const postcode = form.querySelector('[name="postcode"]').value.trim();
    const checked  = [...form.querySelectorAll('input[name="issues"]:checked')];

    if (!name || !street || !suburb || !state || !postcode) { alert('Please fill in all address fields.'); return; }
    if (checked.length === 0) { alert('Please select at least one issue.'); return; }

    const address = `${street}, ${suburb} ${state} ${postcode}`;
    const issueList = checked.map(c => `Issue ${c.value}`).join(', ');
    const total = calcTotal(checked.length);
    const saving = (checked.length * 10) - total;

    const btn = form.querySelector('.btn-order');
    btn.textContent = 'Sending...';
    btn.disabled = true;

    try {
      await fetch(FORMSPREE_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'application/json', 'Accept': 'application/json' },
        body: JSON.stringify({ name, address, issues: issueList, total: `$${total}`, saving: saving > 0 ? `$${saving}` : 'none' })
      });
    } catch(err) { console.log('Formspree error', err); }

    // Redirect to PayPal
    closeOrder();
    window.location.href = `https://paypal.me/flatstickzine/${total}AUD`;
  });
});

// ─────────────────────────────────────────────
// Title reel animation
// ─────────────────────────────────────────────
(function() {
  var flatReel = document.querySelector('#word-flat .reel');
  var stickReel = document.querySelector('#word-stick .reel');
  var count = 6;
  var current = 0;
  var spinDir = 1;

  function imgH() {
    return document.querySelector('#word-flat .reel img').offsetHeight;
  }

  function goTo(idx) {
    var pos = idx * imgH();
    flatReel.style.transition = 'none';
    stickReel.style.transition = 'none';
    flatReel.style.transform = 'translateY(-' + pos + 'px)';
    stickReel.style.transform = 'translateY(-' + pos + 'px)';
  }

  function spin() {
    var target = Math.floor(Math.random() * count);
    var steps = 0;
    var maxSteps = 8;
    var tempIdx = current;
    var fd = spinDir;
    var sd = spinDir * -1;

    function tick() {
      steps++;
      var fi = (tempIdx + fd + count) % count;
      var si = (tempIdx + sd + count) % count;
      tempIdx = fi;
      var dur = steps < maxSteps - 2 ? 120 : 400;
      flatReel.style.transition = 'transform ' + dur + 'ms ease-in-out';
      stickReel.style.transition = 'transform ' + dur + 'ms ease-in-out';
      flatReel.style.transform = 'translateY(-' + (fi * imgH()) + 'px)';
      stickReel.style.transform = 'translateY(-' + (si * imgH()) + 'px)';
      if (steps < maxSteps) {
        setTimeout(tick, dur + 20);
      } else {
        flatReel.style.transition = 'transform 500ms ease-out';
        stickReel.style.transition = 'transform 500ms ease-out';
        flatReel.style.transform = 'translateY(-' + (target * imgH()) + 'px)';
        stickReel.style.transform = 'translateY(-' + (target * imgH()) + 'px)';
        current = target;
        spinDir *= -1;
        setTimeout(spin, 9000);
      }
    }
    tick();
  }

  window.addEventListener('load', function() {
    goTo(0);
    setTimeout(spin, 4000);
  });
})();
